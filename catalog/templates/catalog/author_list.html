{% extends "base_generic.html" %}

{% block content %}
<h1>Authors</h1>

<ul>
  {% for author in author_list %}
    <li>
      <a href="{% url 'author-detail' author.pk %}">{{ author.first_name }} {{ author.last_name }}</a>
    </li>
  {% empty %}
    <li>No authors found.</li>
  {% endfor %}
</ul>
{% endblock %}
